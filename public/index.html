<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orange Social</title>
<meta name="description" content="Orange Social website under construction.">
<style>
  :root { color-scheme: light dark; --fg:#1d1d1f; --muted:#5f5f63; --bg:#fbfaf8; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f2; --muted:#a8a8ad; --bg:#141414; --accent:#fb923c; } }
  html,body { margin:0; height:100%; }
  body { display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; padding:0 16px; }
  main { max-width:32rem; }
  h1 { font-size:1.75rem; font-weight:600; letter-spacing:-0.01em; margin:0 0 .5rem; }
  h1 span { color:var(--accent); }
  p { margin:.25rem 0; color:var(--muted); }
  a { color:inherit; text-underline-offset:3px; }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Orange Social<span>.</span></h1>
  <p>Our website is under construction.</p>
  <p>Contact: <a href="mailto:hello@orangesocial.app">hello@orangesocial.app</a></p>
</main>
</body>
</html>
